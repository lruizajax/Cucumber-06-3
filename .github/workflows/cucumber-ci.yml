name: Cucumber CI - Online
on:
  push:
    branches:
      - master
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    # step 1: Checkout the repository
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

    # step 2: Set up Java
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

    # step 3: download dependencies
      - name: Download Dependencies
        uses: actions/cache@v5
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

    # step 4: Install allure dependencies
      - name: Install Allure Dependencies
        run: |
          ALLURE_VERSION=2.46.1
          wget https://github.com/allure-framework/allure2/releases/download/${ALLURE_VERSION}/allure-${ALLURE_VERSION}.tgz
          tar -zxvf allure-${ALLURE_VERSION}.tgz
          echo "$PWD/allure-${ALLURE_VERSION}/bin" >> $GITHUB_PATH

    # step 5: verify allure installation
      - name: Verify Allure Installation
        run: allure --version

    # step 6: Run tests with cucumber
      - name: Run Cucumber Tests
        run: mvn clean verify -Dcucumber.filter.tags="@regression"

    # step 7: Generate Allure report
      - name: Generate Allure Report
        if: always()
        run: allure generate target/allure-results --clean -o target/allure-report

    # step 8: Upload maven-cucumber-reporting report as an artifact
      - name: Upload Maven Cucumber Report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: maven-cucumber-report
          path: |
            target/cucumber-html-reports
            target/cucumber-html-reports/overview-features.html

    # step 9: Upload Allure report as an artifact
      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: allure-report
          path: target/allure-report